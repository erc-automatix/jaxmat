[project]
name = "jaxmat"
version = "0.1"
description = "Automated material constitutive modeling in JAX"
readme = "README.md"
authors = [
    { name = "Jeremy Bleyer", email = "jeremy.bleyer@enpc.fr" },
    { name = "Paul Bouteiller", email = "paul.bouteiller@cea.fr" },
    { name = "Jack S. Hale", email = "jack.hale@uni.lu" },
    { name = "Ludovic Druette", email = "ludovic.druette@edf.fr" }
]
license = "LGPL-3.0-or-later"
keywords = ["material science", "machine learning", "material modeling", "solid mechanics", "automatic differentiation"]
requires-python = ">=3.12"
dependencies = [
    "jax>=0.6.1",
    "optax>=0.2.5",
    "equinox>=0.12.2",
    "optimistix>=0.1.0",
    "lineax>=0.1.0",    
    "paramax>=0.0.5",      
]


[project.urls]
Homepage = "https://erc-automatix.github.io/jaxmat/"
Repository = "https://github.com/erc-automatix/jaxmat"
Documentation = "https://erc-automatix.github.io/jaxmat/"

[project.optional-dependencies]
docs = [
    "matplotlib>=3.8",
    "jupytext",
    "jupyter_book<2",
    "sphinx_autodoc_typehints",
    "sphinx_math_dollar",
    "diffrax>=0.7",    
]
gpu = [
    "jax[cuda12]>=0.6.1",
]
test = [
    "matplotlib>=3.8",
    "pytest>=8.0",
    "scipy",
    "pre-commit"
]

[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["jaxmat*"]

[tool.ruff]
line-length = 100
indent-width = 4

[tool.ruff.lint]
select = [
#      "D",      # pydocstyle
      "E",      # pycodestyle
      "W",      # pycodestyle
      "F",      # pyflakes
      "I",      # isort - use standalone isort
      "RUF",    # Ruff-specific rules
      "UP",     # pyupgrade
      "ICN",    # flake8-import-conventions
      "NPY",    # numpy-specific rules
      "FLY",    # use f-string not static joins
      "NPY201", # numpy 2.x ruleset
]
